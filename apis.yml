name: Ai Vivo
description: >-
  AI VIVO (AIVIVO LTD) is a Cambridge, England based drug-discovery company that
  combines systems pharmacology with artificial intelligence to accelerate the
  identification and de-risking of therapeutic candidates. Its "Organome"
  platform simulates biological processes at the target, cell, organ, and
  organism levels and ranks drug candidates by their phenotypic effects at the
  tissue level, without relying on prior knowledge of the disease or compounds.
  The approach gained recognition in 2020 when the platform ranked roughly
  90,000 compounds for COVID-19 and surfaced dexamethasone as a top candidate
  weeks before its clinical benefit was widely reported. AI VIVO is backed by
  DCVC and other life-science and applied-AI investors. As of this profile the
  company publishes a minimal public web presence (a home and contact page) and
  exposes no public developer API, documentation, or SDK.
